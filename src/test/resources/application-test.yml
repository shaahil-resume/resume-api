clients:
  postman:
    secret: test-postman-secret
  bff-admin:
    secret: test-bff-secret
    redirect-uri: http://localhost:3000/auth/callback
  pitcher:
    secret: test-pitcher-secret
  ai-module:
    secret: test-ai-module-secret
  bff:
    secret: test-bff-client-secret
spring:
  ai:
    openai:
      api-key: test-openai-key
      embedding:
        model: test-embedding-model
    vectorstore:
      pgvector:
        dimensions: 1536
  datasource:
    url: jdbc:h2:mem:resume_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
